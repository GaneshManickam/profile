<!DOCTYPE html>
<html lang="en">

<head>
  <!--
    The base href is replaced by the value of `--base-href` at build time.
    GitHub Pages serves this site from /profile/, so build with:
      flutter build web --release --base-href /profile/
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Portfolio of Ganesh Manickam — Mobile Application Developer, Staff Engineer - iOS & Mobile App Architect.">
  <meta name="google-site-verification" content="google8f6dec38b4a0887e" />
  <meta name="theme-color" content="#06070B">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ganesh Manickam | Mobile Application Developer">
  <meta property="og:description" content="Staff Engineer - iOS & Mobile App Architect. 15+ apps across FinTech, E-Commerce, Health and Streaming.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ganesh Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Ganesh Manickam | Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #06070B; }
    #boot {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(60% 50% at 50% 45%, rgba(61,224,255,.10), rgba(139,108,255,.06) 45%, #06070B 75%);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #6B7385; letter-spacing: .2em; font-size: 11px; text-transform: uppercase;
      transition: opacity .6s ease, visibility .6s ease;
    }
    #boot.done { opacity: 0; visibility: hidden; }
    #boot .mark {
      position: relative; width: 64px; height: 64px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #3DE0FF, #8B6CFF);
      color: #06070B; font: 800 20px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0;
      box-shadow: 0 0 40px rgba(61,224,255,.35);
    }
    #boot .mark::after {
      content: ""; position: absolute; inset: -10px; border-radius: 50%;
      border: 1px solid rgba(61,224,255,.45);
      animation: ping 1.6s cubic-bezier(.2,0,0,1) infinite;
    }
    #boot .bar { width: 120px; height: 2px; background: rgba(255,255,255,.08); overflow: hidden; border-radius: 2px; }
    #boot .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: linear-gradient(90deg, #3DE0FF, #8B6CFF);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes ping { from { transform: scale(.85); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #boot .mark::after, #boot .bar::after { animation: none; }
    }
  </style>
</head>

<body>
  <div id="boot" role="status" aria-label="Loading portfolio">
    <div class="mark">GM</div>
    <div class="bar"></div>
    <div>Loading experience</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 700);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
